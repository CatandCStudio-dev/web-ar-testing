<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AR Kompas & Bola Arah</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
 <style>
  body { margin: 0; overflow: hidden; background: black; }

  #scanning-text {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: white;
    font-size: 24px;
    font-family: Arial, sans-serif;
    text-shadow: 0 0 10px black;
    background: rgba(0,0,0,0.4);
    padding: 12px 20px;
    border-radius: 8px;
    display: none;
    animation: pulse 1.5s infinite;
    z-index: 5;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.6; }
  }

  /* 🔺 Kompas Arrow Buatan Sendiri (tanpa gambar) */
  #compass-arrow {
    position: fixed;
    top: 15px;
    left: 50%;
    transform: translateX(-50%) rotate(0deg);
    width: 0;
    height: 0;
    border-left: 25px solid transparent;
    border-right: 25px solid transparent;
    border-bottom: 40px solid red; /* warna panah */
    filter: drop-shadow(0 0 3px black);
    z-index: 999;
    opacity: 0.9;
    pointer-events: none;
  }

  #heading-text {
    position: fixed;
    top: 75px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 18px;
    color: white;
    text-shadow: 0 0 5px black;
    z-index: 999;
  }
</style>

</head>
<body>
  <div id="scanning-text">🔍 Scanning environment...</div>
  <div id="compass-arrow"></div>
  <div id="heading-text">Heading: 0°</div>

  <script type="module">
  import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";

  let camera, scene, renderer, reticle;
  let hitTestSource = null;
  let localSpace = null;
  let surfaceDetected = false;
  let scanningText = document.getElementById("scanning-text");
  let navigationSpheres = [];
  // hysteresis untuk mencegah bola hilang karena fluktuasi heading singkat
  let lostHeadingFrames = 0;
  const LOST_FRAMES_THRESHOLD = 30; // jumlah frame sebelum dianggap "hilang" (sesuaikan)
  const HYSTERESIS_ANGLE = 100; // tambahan sudut agar lebih toleran ketika menghapus

  // 🎯 Target arah (Utara)
  const TARGET_HEADING = 0;      // derajat utara
  const ANGLE_THRESHOLD = 3;    // toleransi arah 
  let sphereSpawned = false;

  // Kompas heading global
  let userHeading = 0;
  const compassArrow = document.getElementById("compass-arrow");

  init();

  async function init() {
    // Setup renderer
    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.xr.enabled = true;
    document.body.appendChild(renderer.domElement);

    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);
    scene.add(new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1));

    // Reticle
    const ringGeo = new THREE.RingGeometry(0.1, 0.11, 32).rotateX(-Math.PI / 2);
    const ringMat = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
    reticle = new THREE.Mesh(ringGeo, ringMat);
    reticle.matrixAutoUpdate = false;
    reticle.visible = false;
    scene.add(reticle);

    // Overlay start
    const overlay = document.createElement("div");
    overlay.textContent = "👆 Tap to Start AR Kompas";
    Object.assign(overlay.style, {
      position: "fixed", inset: 0, background: "black", color: "white",
      display: "flex", justifyContent: "center", alignItems: "center",
      fontSize: "22px", cursor: "pointer", zIndex: 100
    });
    document.body.appendChild(overlay);
    overlay.addEventListener("click", async () => {
      overlay.remove();
      startAR();
    });

    // Setup kompas listener
    setupCompass();

    // Resize
    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  }

  async function setupCompass() {
    let smoothedHeading = null;
    const smoothingFactor = 0.12;

    function handleOrientationEvent(event) {
      const alpha = (event.absolute && event.alpha != null) ? event.alpha : event.alpha;
      if (alpha == null) return;

      const raw = 360 - alpha; // ubah jadi searah jarum jam dari utara

      // smoothing
      if (smoothedHeading === null) smoothedHeading = raw;
      else {
        let diff = raw - smoothedHeading;
        if (diff > 180) diff -= 360;
        if (diff < -180) diff += 360;
        smoothedHeading += diff * smoothingFactor;
      }

      smoothedHeading = (smoothedHeading + 360) % 360;
      userHeading = smoothedHeading;

      compassArrow.style.transform = `translateX(-50%) rotate(${userHeading}deg)`;
      document.getElementById("heading-text").textContent = `Heading: ${userHeading.toFixed(1)}°`;
    }

    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
      // iOS Safari: butuh izin
      const permBtn = document.createElement('button');
      permBtn.textContent = 'Izinkan Kompas';
      Object.assign(permBtn.style, {
        position: 'fixed', bottom: '10px', left: '50%',
        transform: 'translateX(-50%)', zIndex: 2000,
        padding: '8px 12px', borderRadius: '8px', background: '#222', color: 'white'
      });
      document.body.appendChild(permBtn);
      permBtn.addEventListener('click', async () => {
        try {
          const resp = await DeviceOrientationEvent.requestPermission();
          permBtn.remove();
          if (resp === 'granted') {
            window.addEventListener('deviceorientationabsolute', handleOrientationEvent, true);
            window.addEventListener('deviceorientation', handleOrientationEvent, true);
          }
        } catch (e) {
          permBtn.remove();
          window.addEventListener('deviceorientationabsolute', handleOrientationEvent, true);
          window.addEventListener('deviceorientation', handleOrientationEvent, true);
        }
      });
    } else {
      // Android: langsung aktif
      window.addEventListener('deviceorientationabsolute', handleOrientationEvent, true);
      window.addEventListener('deviceorientation', handleOrientationEvent, true);
    }
  }

  async function startAR() {
    const session = await navigator.xr.requestSession("immersive-ar", {
      requiredFeatures: ["hit-test", "dom-overlay"],
      domOverlay: { root: document.body }
    });
    renderer.xr.setReferenceSpaceType("local");
    await renderer.xr.setSession(session);

    scanningText.style.display = 'block';

    const refSpace = await session.requestReferenceSpace("local");
    const viewerSpace = await session.requestReferenceSpace("viewer");
    hitTestSource = await session.requestHitTestSource({ space: viewerSpace });
    localSpace = refSpace;

    renderer.setAnimationLoop(render);
  }

  function addNavigationSpheres(originPose) {
    const numSpheres = 5;
    const stepDistance = 1.0;

    for (let i = 1; i <= numSpheres; i++) {
      const distance = i * stepDistance;
      const angle = THREE.MathUtils.degToRad(userHeading);

      const xPos = Math.sin(angle) * distance;
      const zPos = -Math.cos(angle) * distance;

      const sphereGeo = new THREE.SphereGeometry(0.1, 16, 16);
      const sphereMat = new THREE.MeshBasicMaterial({
        color: 0x00aaff,
        transparent: true,
        opacity: 0.9
      });
      const sphere = new THREE.Mesh(sphereGeo, sphereMat);

      if (originPose) {
        const planeY = originPose.transform.position.y;
        sphere.position.set(xPos, planeY + 0.05, zPos);
      } else {
        sphere.position.set(xPos, 0, zPos);
      }

      scene.add(sphere);
      navigationSpheres.push(sphere);
    }
  }

  function shortestAngleDiff(a, b) {
  // kembalikan selisih sudut terkecil (0..180)
  return Math.abs(((a - b + 540) % 360) - 180);
}

  function render(timestamp, frame) {
    if (frame && hitTestSource) {
      const hitTestResults = frame.getHitTestResults(hitTestSource);
      if (hitTestResults.length > 0) {
        const hit = hitTestResults[0];
        const pose = hit.getPose(localSpace);
        reticle.visible = true;
        reticle.matrix.fromArray(pose.transform.matrix);
        if (!surfaceDetected) {
          surfaceDetected = true;
          scanningText.style.display = 'none';
        }
      } else {
        reticle.visible = false;
        if (surfaceDetected) {
          surfaceDetected = false;
          scanningText.style.display = 'block';
        }
      }
    }

    // 🧭 Spawn bola: pastikan ada hit pose sebelum spawn
    const angDiff = shortestAngleDiff(userHeading, TARGET_HEADING);
    if (surfaceDetected && !sphereSpawned && reticle.visible && angDiff <= ANGLE_THRESHOLD) {
      // ambil pose dengan aman
      let pose = null;
      if (frame && hitTestSource) {
        const results = frame.getHitTestResults(hitTestSource);
        if (results.length > 0) pose = results[0].getPose(localSpace);
      }
      if (pose) {
        addNavigationSpheres(pose);
        sphereSpawned = true;
        lostHeadingFrames = 0;
        console.log("🎯 Bola biru di-spawn karena arah sesuai target!");
      }
    }

    // Hapus bola dengan hysteresis: hanya hapus jika angDiff > (threshold + HYSTERESIS_ANGLE)
    // dan terjadi terus menerus selama LOST_FRAMES_THRESHOLD frame
    if (sphereSpawned) {
      if (angDiff > (ANGLE_THRESHOLD + HYSTERESIS_ANGLE)) {
        lostHeadingFrames++;
      } else {
        lostHeadingFrames = 0;
      }

      if (lostHeadingFrames >= LOST_FRAMES_THRESHOLD) {
        navigationSpheres.forEach(s => scene.remove(s));
        navigationSpheres = [];
        sphereSpawned = false;
        lostHeadingFrames = 0;
        console.log("❌ Arah berubah konsisten, bola dihapus");
      }
    }

    renderer.render(scene, camera);
  }

  </script>
</body>
</html>
