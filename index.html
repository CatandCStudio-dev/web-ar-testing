<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <title>AR GPS Arrow Path</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

  <!-- A-Frame + AR.js -->
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.3.2/aframe/build/aframe-ar-nft.js"></script>

  <style>
    body, html { margin: 0; padding: 0; overflow: hidden; }
    #info {
      position: fixed;
      top: 10px; left: 10px;
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 8px 12px;
      border-radius: 8px;
      font-family: sans-serif;
      font-size: 14px;
      z-index: 9999;
    }
  </style>
</head>
<body>
  <div id="info">📡 Mengambil lokasi...</div>

  <!-- Scene AR -->
  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    arjs="sourceType: webcam; trackingMethod: best; debugUIEnabled: false;">
    
    <a-camera gps-camera rotation-reader></a-camera>

    <!-- Container untuk panah -->
    <a-entity id="arrow-container"></a-entity>
  </a-scene>

  <script>
    const info = document.getElementById('info');
    const container = document.getElementById('arrow-container');
    const ARROW_MODEL = "https://raw.githubusercontent.com/CatandCStudio-dev/web-ar-testing/test-ar-js/Assets/arrow.glb";

    // 🎯 Koordinat target
    const TARGET = { lat: -7.5425223, lon: 110.7700842 };

    // Jarak antar panah (meter)
    const STEP = 10;

    // Fungsi membuat deretan panah dari posisi pengguna ke target
    function createArrowPath(userLat, userLon, targetLat, targetLon) {
      // Hapus panah lama
      while (container.firstChild) container.removeChild(container.firstChild);

      const totalDistance = getDistance(userLat, userLon, targetLat, targetLon);
      const bearing = getBearing(userLat, userLon, targetLat, targetLon);

      const numArrows = Math.floor(totalDistance / STEP);
      info.innerHTML += `<br>🪶 Membuat ${numArrows} panah...`;

      for (let i = 1; i <= numArrows; i++) {
        const d = STEP * i;
        const point = getDestinationPoint(userLat, userLon, bearing, d);

        const arrow = document.createElement('a-entity');
        arrow.setAttribute('gltf-model', ARROW_MODEL);
        arrow.setAttribute('scale', '1.5 1.5 1.5');
        arrow.setAttribute('rotation', `0 ${bearing} 0`);
        arrow.setAttribute('gps-entity-place', `latitude: ${point.lat}; longitude: ${point.lon}`);
        container.appendChild(arrow);
      }
    }

    // Saat posisi pengguna diperbarui
    window.addEventListener('gps-camera-update-position', (e) => {
      const userLat = e.detail.position.latitude;
      const userLon = e.detail.position.longitude;

      const distance = getDistance(userLat, userLon, TARGET.lat, TARGET.lon);
      const bearing = getBearing(userLat, userLon, TARGET.lat, TARGET.lon);

      info.innerHTML = `
        📍 Posisi Anda: ${userLat.toFixed(5)}, ${userLon.toFixed(5)}<br>
        🎯 Tujuan: ${TARGET.lat.toFixed(5)}, ${TARGET.lon.toFixed(5)}<br>
        📏 Jarak: ${distance.toFixed(1)} m<br>
        🧭 Arah: ${bearing.toFixed(1)}°
      `;

      createArrowPath(userLat, userLon, TARGET.lat, TARGET.lon);
    });

    // ====== Fungsi utilitas ======
    function getDistance(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const toRad = x => x * Math.PI / 180;
      const φ1 = toRad(lat1), φ2 = toRad(lat2);
      const Δφ = toRad(lat2 - lat1), Δλ = toRad(lon2 - lon1);
      const a = Math.sin(Δφ/2)**2 + Math.cos(φ1)*Math.cos(φ2)*Math.sin(Δλ/2)**2;
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }

    function getBearing(lat1, lon1, lat2, lon2) {
      const toRad = x => x * Math.PI / 180;
      const toDeg = x => x * 180 / Math.PI;
      const φ1 = toRad(lat1), φ2 = toRad(lat2);
      const Δλ = toRad(lon2 - lon1);
      const y = Math.sin(Δλ) * Math.cos(φ2);
      const x = Math.cos(φ1)*Math.sin(φ2) - Math.sin(φ1)*Math.cos(φ2)*Math.cos(Δλ);
      const brng = Math.atan2(y, x);
      return (toDeg(brng) + 360) % 360;
    }

    // Hitung titik tujuan dengan jarak dan arah tertentu
    function getDestinationPoint(lat, lon, bearing, distance) {
      const R = 6371e3;
      const toRad = x => x * Math.PI / 180;
      const toDeg = x => x * 180 / Math.PI;
      const δ = distance / R;
      const θ = toRad(bearing);
      const φ1 = toRad(lat);
      const λ1 = toRad(lon);

      const φ2 = Math.asin(Math.sin(φ1) * Math.cos(δ) +
                           Math.cos(φ1) * Math.sin(δ) * Math.cos(θ));
      const λ2 = λ1 + Math.atan2(Math.sin(θ) * Math.sin(δ) * Math.cos(φ1),
                                 Math.cos(δ) - Math.sin(φ1) * Math.sin(φ2));

      return { lat: toDeg(φ2), lon: toDeg(λ2) };
    }
  </script>
</body>
</html>
