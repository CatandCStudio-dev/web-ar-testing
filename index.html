<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebXR Ground Tracking</title>

    <!-- A-Frame dengan dukungan WebXR -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  </head>

  <body style="margin: 0; overflow: hidden;">
    <a-scene
      vr-mode-ui="enabled: false"
      webxr="optionalFeatures: hit-test, dom-overlay; overlayElement: #overlay;"
      renderer="colorManagement: true; physicallyCorrectLights;"
      embedded
      cursor="rayOrigin: mouse;"
    >
      <!-- Cahaya -->
      <a-light type="ambient" intensity="0.8"></a-light>
      <a-light type="directional" position="1 1 1" intensity="1"></a-light>

      <!-- Kamera -->
      <a-camera position="0 1.6 0" look-controls></a-camera>

      <!-- Objek akan muncul di sini saat disentuh -->
      <a-entity id="modelContainer"></a-entity>

      <!-- Lantai virtual untuk debug -->
      <a-plane rotation="-90 0 0" width="4" height="4" color="#ccc" visible="false"></a-plane>
    </a-scene>

    <div id="overlay" style="
      position: absolute;
      bottom: 10px;
      width: 100%;
      text-align: center;
      color: white;
      font-family: sans-serif;
    ">
      <p>Ketuk layar untuk menaruh objek di permukaan</p>
    </div>

    <script>
      const sceneEl = document.querySelector('a-scene');
      const modelContainer = document.getElementById('modelContainer');

      sceneEl.addEventListener('click', e => {
        const viewerSpace = sceneEl.renderer.xr.getReferenceSpace();
        const frame = sceneEl.renderer.xr.getFrame();

        if (frame && frame.getHitTestResults) {
          const hitTestSource = frame.getHitTestResults(frame.session.hitTestSource);
          if (hitTestSource.length > 0) {
            const pose = hitTestSource[0].getPose(viewerSpace);
            if (pose) {
              const { x, y, z } = pose.transform.position;
              // Buat objek baru di posisi klik
              const box = document.createElement('a-box');
              box.setAttribute('position', `${x} ${y} ${z}`);
              box.setAttribute('color', 'tomato');
              box.setAttribute('scale', '0.3 0.3 0.3');
              modelContainer.appendChild(box);
            }
          }
        }
      });
    </script>
  </body>
</html>
