<!DOCTYPE html>
<html>
  <head>
    <title>AR Navigasi Kampus</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://unpkg.com/aframe@1.5.0/dist/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <a-scene
      vr-mode-ui="enabled: false"
      embedded
      arjs="sourceType: webcam; debugUIEnabled: false;"
    >
      <a-text 
        value="Gedung FTI ada di depan!" 
        gps-entity-place="latitude: -7.5595; longitude: 110.8567;" 
        look-at="[gps-camera]"
        scale="5 5 5"
        color="red">
      </a-text>

      <a-camera gps-camera rotation-reader></a-camera>
    </a-scene>

    <script>
      window.addEventListener('gps-camera-update-position', e => {
        console.log('GPS ready:', e.detail.position);
        alert('GPS sudah aktif! Lokasi: ' + JSON.stringify(e.detail.position));
      });
    </script>
  </body>
</html>
