<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Hello WebXR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <style>
    body { margin: 0; overflow: hidden; }
    #enter-ar {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 24px;
      background: #007aff;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <button id="enter-ar">Enter AR</button>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
    import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';

    let xrSession = null;
    let xrRefSpace = null;
    let hitTestSource = null;

    let renderer, scene, camera;
    let reticle;
    const placedObjects = [];

    const gltfLoader = new GLTFLoader();

    const button = document.getElementById('enter-ar');
    button.addEventListener('click', activateXR);

    async function activateXR() {
      if (!navigator.xr) {
        alert("WebXR not supported on this browser/device.");
        return;
      }

      // Periksa apakah AR mode didukung
      const supported = await navigator.xr.isSessionSupported('immersive-ar');
      if (!supported) {
        alert("AR mode not supported.");
        return;
      }

      xrSession = await navigator.xr.requestSession('immersive-ar', {
        requiredFeatures: ['hit-test', 'local']
      });

      // Siapkan renderer WebGL agar kompatibel XR
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.xr.enabled = true;
      document.body.appendChild(renderer.domElement);

      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera();

      // Reticle (penanda permukaan)
      const ringGeo = new THREE.RingGeometry(0.05, 0.06, 32).rotateX(-Math.PI / 2);
      const ringMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
      reticle = new THREE.Mesh(ringGeo, ringMat);
      reticle.matrixAutoUpdate = false;
      reticle.visible = false;
      scene.add(reticle);

      // Ambient light
      scene.add(new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1));

      // Inisialisasi referensi XR
      xrRefSpace = await xrSession.requestReferenceSpace('local');
      const viewerSpace = await xrSession.requestReferenceSpace('viewer');
      hitTestSource = await xrSession.requestHitTestSource({ space: viewerSpace });

      renderer.xr.setSession(xrSession);
      xrSession.requestAnimationFrame(onXRFrame);

      xrSession.addEventListener('select', onSelect);

      // Tombol disembunyikan ketika AR aktif
      button.style.display = 'none';
    }

    function onSelect() {
      if (reticle.visible) {
        // Contoh: buat objek kubus kecil di posisi reticle
        const geometry = new THREE.BoxGeometry(0.1, 0.1, 0.1);
        const material = new THREE.MeshStandardMaterial({ color: 0xff8844 });
        const cube = new THREE.Mesh(geometry, material);
        cube.position.setFromMatrixPosition(reticle.matrix);
        cube.quaternion.setFromRotationMatrix(reticle.matrix);
        scene.add(cube);
        placedObjects.push(cube);

        // Jika ingin model 3D:
        /*
        gltfLoader.load('models/flower.glb', (gltf) => {
          const model = gltf.scene;
          model.position.setFromMatrixPosition(reticle.matrix);
          model.quaternion.setFromRotationMatrix(reticle.matrix);
          model.scale.set(0.3, 0.3, 0.3);
          scene.add(model);
          placedObjects.push(model);
        });
        */
      }
    }

    function onXRFrame(time, frame) {
      const session = frame.session;
      const pose = frame.getViewerPose(xrRefSpace);
      if (!pose) return;

      const hitTestResults = frame.getHitTestResults(hitTestSource);
      if (hitTestResults.length > 0) {
        const hit = hitTestResults[0];
        const hitPose = hit.getPose(xrRefSpace);
        reticle.visible = true;
        reticle.matrix.fromArray(hitPose.transform.matrix);
      } else {
        reticle.visible = false;
      }

      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.render(scene, camera);

      session.requestAnimationFrame(onXRFrame);
    }
  </script>
</body>
</html>
