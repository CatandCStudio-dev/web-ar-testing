<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebXR Ground Plane Visualization</title>
  <style>
    body { margin: 0; overflow: hidden; }
    #info { position: absolute; top: 10px; left: 10px; padding: 6px 10px; color: #fff; background: rgba(0,0,0,0.5); border-radius: 5px; font-family: sans-serif; }
  </style>
</head>
<body>
  <div id="info">Menunjukkan sinar dan hasil hit-test pada permukaan datar</div>
  <script type="module">
    import * as THREE from 'https://unpkg.com/three@0.158.0/build/three.module.js';
    import { ARButton } from 'https://unpkg.com/three@0.158.0/examples/jsm/webxr/ARButton.js';

    let camera, scene, renderer;
    let reticle, rayLine, hitPoint, hitTestSource = null, hitTestSourceRequested = false, localReferenceSpace = null;

    init();

    function init() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

      const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
      scene.add(light);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true;
      document.body.appendChild(renderer.domElement);

      document.body.appendChild(ARButton.createButton(renderer, { requiredFeatures: ['hit-test'] }));

      // Reticle (cincin)
      const ringGeo = new THREE.RingGeometry(0.05, 0.08, 32);
      const ringMat = new THREE.MeshBasicMaterial({ color: 0x00ffff, side: THREE.DoubleSide, opacity: 0.8, transparent: true });
      reticle = new THREE.Mesh(ringGeo, ringMat);
      reticle.rotation.x = -Math.PI / 2;
      reticle.visible = false;
      scene.add(reticle);

      // Ray visualizer (garis)
      const rayGeo = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(0, 0, 0),
        new THREE.Vector3(0, 0, -1)
      ]);
      const rayMat = new THREE.LineBasicMaterial({ color: 0xff0000 });
      rayLine = new THREE.Line(rayGeo, rayMat);
      scene.add(rayLine);

      // Titik hasil hit-test (bola kecil)
      const pointGeo = new THREE.SphereGeometry(0.01, 16, 16);
      const pointMat = new THREE.MeshBasicMaterial({ color: 0xffff00 });
      hitPoint = new THREE.Mesh(pointGeo, pointMat);
      hitPoint.visible = false;
      scene.add(hitPoint);

      window.addEventListener('resize', onWindowResize);
      renderer.setAnimationLoop(render);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function render(timestamp, frame) {
      if (frame) {
        const session = renderer.xr.getSession();

        if (!localReferenceSpace) {
          session.requestReferenceSpace('local').then(ref => localReferenceSpace = ref);
        }

        if (!hitTestSourceRequested) {
          session.requestReferenceSpace('viewer').then((viewerSpace) => {
            session.requestHitTestSource({ space: viewerSpace }).then((source) => hitTestSource = source);
          });
          session.addEventListener('end', () => {
            hitTestSourceRequested = false;
            hitTestSource = null;
            localReferenceSpace = null;
          });
          hitTestSourceRequested = true;
        }

        if (hitTestSource && localReferenceSpace) {
          const hitTestResults = frame.getHitTestResults(hitTestSource);

          if (hitTestResults.length > 0) {
            const hit = hitTestResults[0];
            const pose = hit.getPose(localReferenceSpace);

            reticle.visible = true;
            reticle.matrix.fromArray(pose.transform.matrix);
            reticle.matrix.decompose(reticle.position, reticle.quaternion, reticle.scale);

            // Tampilkan titik hasil hit-test
            hitPoint.visible = true;
            hitPoint.position.copy(reticle.position);

            // Update rayLine dari kamera ke reticle
            const start = new THREE.Vector3().setFromMatrixPosition(camera.matrixWorld);
            const end = reticle.position.clone();
            const points = [start, end];
            rayLine.geometry.setFromPoints(points);
          } else {
            reticle.visible = false;
            hitPoint.visible = false;
          }
        }
      }
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
