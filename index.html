<!DOCTYPE html>
<html>
  <head>
    <title>AR Navigasi Kampus</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Versi A-Frame yang kompatibel -->
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    
    <!-- AR.js build yang stabil -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    
    <!-- Komponen GPS -->
    <script src="https://unpkg.com/aframe-gps-entity-place/dist/aframe-gps-entity-place.min.js"></script>
  </head>

  <body style="margin: 0; overflow: hidden;">
    <a-scene
      vr-mode-ui="enabled: false"
      embedded
      arjs="sourceType: webcam; debugUIEnabled: false;"
    >
      <!-- Tujuan -->
      <a-text 
        id="arah"
        value="Menuju Gedung FTI"
        gps-entity-place="latitude: -7.5595; longitude: 110.8567;"
        look-at="[gps-camera]"
        scale="5 5 5"
        color="red">
      </a-text>

      <!-- Panah penunjuk arah -->
      <a-entity
        id="arrow"
        geometry="primitive: cone; height: 3; radiusBottom: 1;"
        material="color: blue"
        position="0 2 -10"
        rotation="0 0 0"
      ></a-entity>

      <a-camera gps-camera rotation-reader></a-camera>
    </a-scene>

    <script>
      const tujuan = { lat: -7.5595, lon: 110.8567 };
      const arrow = document.getElementById("arrow");

      window.addEventListener("gps-camera-update-position", e => {
        const pos = e.detail.position;
        const bearing = getBearing(pos.latitude, pos.longitude, tujuan.lat, tujuan.lon);
        arrow.setAttribute("rotation", `0 ${-bearing} 0`);
      });

      function getBearing(lat1, lon1, lat2, lon2) {
        const toRad = x => x * Math.PI / 180;
        const dLon = toRad(lon2 - lon1);
        const y = Math.sin(dLon) * Math.cos(toRad(lat2));
        const x = Math.cos(toRad(lat1)) * Math.sin(toRad(lat2)) -
                  Math.sin(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.cos(dLon);
        let brng = Math.atan2(y, x);
        brng = brng * 180 / Math.PI;
        return (brng + 360) % 360;
      }
    </script>
  </body>
</html>
