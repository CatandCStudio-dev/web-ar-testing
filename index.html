<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Hello WebXR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <style>
    body { margin: 0; overflow: hidden; }
    #enter-ar {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 24px;
      background: #007aff;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <button id="enter-ar">Enter AR</button>

  <script type="module">
  import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";
  import { ARButton } from "https://unpkg.com/three@0.160.0/examples/jsm/webxr/ARButton.js";

  let camera, scene, renderer, reticle;
  let controller;
  let scanningText;
let surfaceDetected = false;


  init();
  animate();

  function init() {
    // Renderer setup
    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.xr.enabled = true;
    document.body.appendChild(renderer.domElement);

    // Scene
    scene = new THREE.Scene();

    // Tambahkan indikator scanning
    scanningText = document.createElement('div');
    scanningText.innerText = "🔍 Scanning environment...";
    scanningText.style.position = 'absolute';
    scanningText.style.top = '50%';
    scanningText.style.left = '50%';
    scanningText.style.transform = 'translate(-50%, -50%)';
    scanningText.style.color = 'white';
    scanningText.style.fontSize = '24px';
    scanningText.style.fontFamily = 'Arial, sans-serif';
    scanningText.style.textShadow = '0 0 10px black';
    document.body.appendChild(scanningText);

    // Camera
    camera = new THREE.PerspectiveCamera(
      70,
      window.innerWidth / window.innerHeight,
      0.01,
      20
    );

    // Light
    const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
    scene.add(light);

    // Reticle (penanda posisi)
    const geometry = new THREE.RingGeometry(0.1, 0.11, 32).rotateX(-Math.PI / 2);
    const material = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
    reticle = new THREE.Mesh(geometry, material);
    reticle.matrixAutoUpdate = false;
    reticle.visible = false;
    scene.add(reticle);

    // Controller (untuk tap event)
    controller = renderer.xr.getController(0);
    controller.addEventListener("select", onSelect);
    scene.add(controller);

    // AR Button
    document.body.appendChild(ARButton.createButton(renderer, { requiredFeatures: ["hit-test"] }));

    window.addEventListener("resize", onWindowResize);
  }

  function onSelect() {
    if (reticle.visible) {
      const geometry = new THREE.BoxGeometry(0.1, 0.1, 0.1);
      const material = new THREE.MeshPhongMaterial({ color: 0x44aa88 });
      const mesh = new THREE.Mesh(geometry, material);
      mesh.position.setFromMatrixPosition(reticle.matrix);
      scene.add(mesh);
    }
  }

  function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  }

  function animate() {
    renderer.setAnimationLoop(render);
  }

  let hitTestSource = null;
  let localSpace = null;

  async function render(timestamp, frame) {
    if (frame) {
      const referenceSpace = renderer.xr.getReferenceSpace();
      const session = renderer.xr.getSession();

      if (!hitTestSource) {
        const viewerSpace = await session.requestReferenceSpace("viewer");
        hitTestSource = await session.requestHitTestSource({ space: viewerSpace });
        localSpace = referenceSpace;
      }

      const hitTestResults = frame.getHitTestResults(hitTestSource);

      if (hitTestResults.length > 0) {
        const hit = hitTestResults[0];
        const pose = hit.getPose(localSpace);
        reticle.visible = true;
        reticle.matrix.fromArray(pose.transform.matrix);

        // Jika baru pertama kali mendeteksi permukaan
        if (!surfaceDetected) {
          surfaceDetected = true;
          scanningText.style.display = 'none'; // sembunyikan teks
        }
      } else {
        reticle.visible = false;

        // Jika kehilangan permukaan
        if (surfaceDetected) {
          surfaceDetected = false;
          scanningText.style.display = 'block'; // tampilkan lagi teks
        }
      }
    }

    renderer.render(scene, camera);
  }
  </script>

</body>
</html>
