<!DOCTYPE html>
<html>
<head>
    <title>WebXR Ground Tracking (Hit-Test) dengan A-Frame</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script> 
    
    <script>
        // Mendefinisikan sebuah komponen A-Frame
        AFRAME.registerComponent('place-on-hit', {
            init: function () {
                const el = this.el;
                
                // 1. Buat Reticle (target) untuk menandai lokasi yang terdeteksi
                this.reticle = document.createElement('a-ring');
                this.reticle.setAttribute('radius', '0.1');
                this.reticle.setAttribute('color', 'green');
                this.reticle.setAttribute('rotation', '-90 0 0'); // Menghadap ke atas
                this.reticle.setAttribute('visible', 'false'); // Sembunyikan sampai permukaan terdeteksi
                el.appendChild(this.reticle);

                // 2. Event Listener untuk Mendeteksi Permukaan
                el.sceneEl.addEventListener('ar-hit-test-start', () => {
                    console.log('Hit-Test Started');
                });

                el.sceneEl.addEventListener('ar-hit-test-result', (event) => {
                    if (event.detail.results.length > 0) {
                        const hit = event.detail.results[0];
                        // Posisikan reticle ke lokasi hit-test
                        this.reticle.setAttribute('position', hit.position);
                        this.reticle.setAttribute('visible', 'true');
                    } else {
                        // Jika tidak ada permukaan yang terdeteksi
                        this.reticle.setAttribute('visible', 'false');
                    }
                });

                // 3. Event Listener untuk Penempatan Objek saat diketuk/klik
                el.sceneEl.addEventListener('touchstart', (event) => {
                    if (this.reticle.getAttribute('visible')) {
                        // Duplikasi posisi reticle
                        const position = this.reticle.getAttribute('position');

                        // Buat objek baru (misalnya, a-box) di posisi tersebut
                        const newObject = document.createElement('a-box');
                        newObject.setAttribute('material', { color: 'red' });
                        newObject.setAttribute('position', position.x + ' ' + (position.y + 0.5) + ' ' + position.z); // Naikkan 0.5 agar tidak tenggelam
                        newObject.setAttribute('scale', '0.5 0.5 0.5');
                        
                        // Tambahkan objek ke scene
                        el.sceneEl.appendChild(newObject);
                    }
                });
            }
        });
    </script>
</head>
<body style='margin : 0px; overflow: hidden;'>

    <a-scene>
      <a-box position="0 1 -3" rotation="0 45 0" color="blue"></a-box>
    </a-scene>

</body>
</html>
