<!doctype html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <title>Hello WebXR with Hit Test</title>

    <script src="https://unpkg.com/three@0.126.0/build/three.js"></script>
    <script src="https://unpkg.com/three@0.126.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

<button onclick="activateXR()">Start Hello WebXR</button>

<script>
// Variabel Global
let session = null;
let referenceSpace = null;
let xrHitTestSource = null;
let reticle = null; // Objek Three.js untuk reticle
let cube = null;    // Objek Three.js untuk kubus (objek yang akan ditempatkan)

async function activateXR() {
    if (!navigator.xr) {
        alert('WebXR not supported on this device/browser.');
        return;
    }

    // Buat canvas + context WebGL XR-compatible terlebih dahulu
    const canvas = document.createElement('canvas');
    document.body.appendChild(canvas);
    const gl = canvas.getContext('webgl', { xrCompatible: true });
    await gl.makeXRCompatible();

    // Buat scene
    const scene = new THREE.Scene();
    
    // Tambahkan pencahayaan agar objek terlihat
    scene.add(new THREE.AmbientLight(0xffffff, 1.0));

    // Buat objek kubus (disembunyikan dulu)
    const materials = [
        new THREE.MeshBasicMaterial({color: 0xff0000}),
        new THREE.MeshBasicMaterial({color: 0x0000ff}),
        new THREE.MeshBasicMaterial({color: 0x00ff00}),
        new THREE.MeshBasicMaterial({color: 0xff00ff}),
        new THREE.MeshBasicMaterial({color: 0x00ffff}),
        new THREE.MeshBasicMaterial({color: 0xffff00})
    ];
    cube = new THREE.Mesh(new THREE.BoxBufferGeometry(0.2, 0.2, 0.2), materials);
    cube.visible = false; // Sembunyikan kubus sampai ditempatkan
    scene.add(cube);
    
    // **Buat Reticle Sederhana (Cincin)**
    const geometry = new THREE.RingGeometry(0.1, 0.12, 32).rotateX(-Math.PI / 2); // Rotasi agar rata dengan lantai
    const material = new THREE.MeshBasicMaterial({ color: 0xffffff });
    reticle = new THREE.Mesh(geometry, material);
    reticle.visible = false; // Sembunyikan reticle sampai permukaan terdeteksi
    scene.add(reticle);


    // Buat renderer menggunakan canvas + gl yang sudah dibuat
    const renderer = new THREE.WebGLRenderer({
        alpha: true,
        preserveDrawingBuffer: true,
        canvas: canvas,
        context: gl
    });
    renderer.autoClear = false;

    // --- Langkah 1: Minta fitur 'hit-test' ---
    session = await navigator.xr.requestSession('immersive-ar', { 
        requiredFeatures: ['local', 'hit-test'] 
    });

    // Pasang XRWebGLLayer ke session
    session.updateRenderState({ baseLayer: new XRWebGLLayer(session, gl) });

    // Minta reference space sebelum memulai loop frame
    referenceSpace = await session.requestReferenceSpace('local');

    // Camera (matriks dikontrol langsung oleh WebXR)
    const camera = new THREE.PerspectiveCamera();
    camera.matrixAutoUpdate = false;
    
    // Tambahkan event listener untuk menempatkan objek saat layar disentuh (select)
    session.addEventListener('select', onSelect);
    
    // --- Langkah 2 & 3: Buat XRHitTestSource ---
    // Gunakan 'viewer' space sebagai sumber ray
    const viewerSpace = await session.requestReferenceSpace('viewer');
    xrHitTestSource = await session.requestHitTestSource({ space: viewerSpace });
    
    // --- Langkah 4: Render loop dan Hit Test ---
    function onXRFrame(time, frame) {
        session.requestAnimationFrame(onXRFrame);

        // Bind framebuffer yang disediakan WebXR
        gl.bindFramebuffer(gl.FRAMEBUFFER, session.renderState.baseLayer.framebuffer);

        const pose = frame.getViewerPose(referenceSpace);
        
        // ⬇️ Lakukan Hit Test ⬇️
        if (xrHitTestSource) {
            const hitTestResults = frame.getHitTestResults(xrHitTestSource);

            if (hitTestResults.length > 0) {
                const hit = hitTestResults[0];
                const pose = hit.getPose(referenceSpace);
                
                // Posisikan reticle ke lokasi hit test
                reticle.matrix.fromArray(pose.transform.matrix);
                reticle.visible = true; // Tampilkan reticle
            } else {
                reticle.visible = false; // Sembunyikan jika tidak ada permukaan terdeteksi
            }
        }
        
        if (pose) {
            // ... (setup viewport) ...
            const view = pose.views[0];
            const viewport = session.renderState.baseLayer.getViewport(view);
            renderer.setSize(viewport.width, viewport.height, false);

            // Masukkan matriks dari WebXR ke camera three.js
            camera.matrix.fromArray(view.transform.matrix);
            camera.projectionMatrix.fromArray(view.projectionMatrix);
            camera.updateMatrixWorld(true);

            // Render scene
            renderer.clearDepth();
            renderer.render(scene, camera);
        }
    }
    
    // Fungsi untuk menempatkan objek saat pengguna menekan layar
    function onSelect() {
        if (reticle.visible) {
            // Kloning posisi reticle ke kubus
            cube.position.setFromMatrixPosition(reticle.matrix);
            cube.visible = true;
        }
    }
    
    // Mulai loop render
    session.requestAnimationFrame(onXRFrame);
    
    // Tambahkan pembersihan saat sesi berakhir
    session.addEventListener('end', () => {
        if (xrHitTestSource) {
            xrHitTestSource.cancel();
            xrHitTestSource = null;
        }
    });
}
</script>
</body>
</html>
