<!DOCTYPE html>
<html>
  <head>
    <title>WebXR Ground Tracking</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <a-scene
      vr-mode-ui="enabled: false"
      renderer="colorManagement: true; physicallyCorrectLights: true;"
      webxr="requiredFeatures: hit-test, local-floor; optionalFeatures: dom-overlay; overlayElement: #overlay;"
      embedded
    >
      <a-light type="ambient" intensity="1"></a-light>
      <a-light type="directional" position="1 3 2" intensity="1.5"></a-light>

      <a-camera id="camera" position="0 1.6 0" look-controls></a-camera>

      <!-- Kontainer untuk menaruh objek -->
      <a-entity id="objects"></a-entity>
    </a-scene>

    <div id="overlay" style="
      position: absolute;
      bottom: 10px;
      width: 100%;
      text-align: center;
      color: white;
      font-family: sans-serif;
    ">
      <p>Gerakkan ponsel untuk mengenali permukaan, lalu ketuk untuk menaruh objek</p>
    </div>

    <script>
      const scene = document.querySelector("a-scene");
      const objects = document.getElementById("objects");

      let hitTestSource = null;
      let localSpace = null;

      scene.addEventListener("enter-vr", async () => {
        const session = scene.renderer.xr.getSession();

        // Pastikan mendukung hit test
        const viewerSpace = await session.requestReferenceSpace("viewer");
        hitTestSource = await session.requestHitTestSource({ space: viewerSpace });
        localSpace = await session.requestReferenceSpace("local-floor");

        session.addEventListener("end", () => {
          hitTestSource = null;
          localSpace = null;
        });
      });

      // Saat user mengetuk layar → taruh objek di permukaan
      scene.addEventListener("click", () => {
        const frame = scene.renderer.xr.getFrame();
        if (!frame || !hitTestSource) return;

        const hitTestResults = frame.getHitTestResults(hitTestSource);
        if (hitTestResults.length > 0) {
          const pose = hitTestResults[0].getPose(localSpace);
          const { x, y, z } = pose.transform.position;

          const box = document.createElement("a-box");
          box.setAttribute("color", "tomato");
          box.setAttribute("scale", "0.3 0.3 0.3");
          box.setAttribute("position", `${x} ${y} ${z}`);
          box.setAttribute("animation", "property: rotation; to: 0 360 0; loop: true; dur: 4000");
          objects.appendChild(box);
        }
      });
    </script>
  </body>
</html>
