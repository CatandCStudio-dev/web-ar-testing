<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <title>WebXR Ground Detection</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    #enter-ar {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #0078ff;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px 20px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <button id="enter-ar">Masuk AR</button>
  <canvas id="xr-canvas"></canvas>

  <script>
    const canvas = document.getElementById("xr-canvas");
    const gl = canvas.getContext("webgl", { xrCompatible: true });
    const btn = document.getElementById("enter-ar");

    let xrSession, xrRefSpace, hitTestSource = null;

    async function initXR() {
      if (!navigator.xr) {
        alert("WebXR tidak didukung di browser ini!");
        return;
      }

      const supported = await navigator.xr.isSessionSupported("immersive-ar");
      if (!supported) {
        alert("Mode AR belum didukung perangkat ini!");
        return;
      }

      btn.addEventListener("click", async () => {
        xrSession = await navigator.xr.requestSession("immersive-ar", {
          requiredFeatures: ["hit-test", "local-floor"]
        });

        xrSession.updateRenderState({
          baseLayer: new XRWebGLLayer(xrSession, gl)
        });

        xrRefSpace = await xrSession.requestReferenceSpace("local-floor");

        // buat hit test source (tengah layar)
        const viewerSpace = await xrSession.requestReferenceSpace("viewer");
        hitTestSource = await xrSession.requestHitTestSource({ space: viewerSpace });

        xrSession.requestAnimationFrame(onXRFrame);
      });
    }

    function onXRFrame(t, frame) {
      const session = frame.session;
      const pose = frame.getViewerPose(xrRefSpace);

      if (pose) {
        const view = pose.views[0];
        const viewport = session.renderState.baseLayer.getViewport(view);
        gl.viewport(viewport.x, viewport.y, viewport.width, viewport.height);

        gl.clearColor(0, 0, 0, 0);
        gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

        // lakukan hit test
        const hitResults = frame.getHitTestResults(hitTestSource);
        if (hitResults.length > 0) {
          const hitPose = hitResults[0].getPose(xrRefSpace);

          // contoh: gambar titik di posisi tanah (console log dulu)
          console.log("Ground point:", hitPose.transform.position);

          // kamu bisa menambahkan renderer 3D di sini untuk menampilkan marker
          // misalnya dengan Three.js (nanti kita lanjutkan ke sana)
        }
      }

      session.requestAnimationFrame(onXRFrame);
    }

    initXR();
  </script>
</body>
</html>
