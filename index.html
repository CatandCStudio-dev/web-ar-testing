<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AR Navigation Prototype</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <style>
    body { margin: 0; overflow: hidden; }
    #map {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 30vh; /* 1/3 layar */
      z-index: 10;
    }
    #scanning-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 24px;
      font-family: Arial, sans-serif;
      text-shadow: 0 0 10px black;
      background: rgba(0,0,0,0.4);
      padding: 12px 20px;
      border-radius: 8px;
      display: none;
      animation: pulse 1.5s infinite;
      z-index: 5;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }
  </style>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
</head>
<body>
  <div id="scanning-text">🔍 Scanning environment...</div>
  <div id="map"></div>

  <script type="module">
  import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";

  let camera, scene, renderer, reticle;
  let hitTestSource = null;
  let localSpace = null;
  let surfaceDetected = false;
  let scanningText = document.getElementById("scanning-text");
  let navigationSpheres = [];
  let userLat = 0, userLon = 0;       // lokasi pengguna
  let targetLat = -7.542726627474412, targetLon = 110.77000583632322; // lokasi tujuan (contoh)
  let userHeading = 0;                // arah pandang pengguna (kompas)


  init();

  async function init() {
    // Setup renderer
    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.xr.enabled = true;
    document.body.appendChild(renderer.domElement);

    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);
    scene.add(new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1));

    // Reticle
    const ringGeo = new THREE.RingGeometry(0.1, 0.11, 32).rotateX(-Math.PI / 2);
    const ringMat = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
    reticle = new THREE.Mesh(ringGeo, ringMat);
    reticle.matrixAutoUpdate = false;
    reticle.visible = false;
    scene.add(reticle);

    // Overlay start
    const overlay = document.createElement("div");
    overlay.textContent = "👆 Tap to Start AR Navigation";
    Object.assign(overlay.style, {
      position: "fixed", inset: 0, background: "black", color: "white",
      display: "flex", justifyContent: "center", alignItems: "center",
      fontSize: "22px", cursor: "pointer", zIndex: 100
    });
    document.body.appendChild(overlay);
    overlay.addEventListener("click", async () => {
      overlay.remove();
      startAR();
    });

    // 🗺️ Setup map (Leaflet)
    const L = await import("https://unpkg.com/leaflet/dist/leaflet-src.esm.js");
    const map = L.map('map').setView([0, 0], 18);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19
    }).addTo(map);
    const userMarker = L.marker([0, 0]).addTo(map);

    // 🔄 Dapatkan arah pandang pengguna (kompas)
    window.addEventListener("deviceorientationabsolute", (event) => {
      if (event.absolute && event.alpha != null) {
        userHeading = 360 - event.alpha; // derajat dari utara searah jarum jam
      }
    });

    // Update GPS
    navigator.geolocation.watchPosition((pos) => {
      userLat = pos.coords.latitude;
      userLon = pos.coords.longitude;
      map.setView([userLat, userLon], 18);
      userMarker.setLatLng([userLat, userLon]);
    });
  }

  async function startAR() {
    const session = await navigator.xr.requestSession("immersive-ar", {
      requiredFeatures: ["hit-test", "dom-overlay"],
      domOverlay: { root: document.body }
    });
    renderer.xr.setReferenceSpaceType("local");
    await renderer.xr.setSession(session);

    scanningText.style.display = 'block';

    const refSpace = await session.requestReferenceSpace("local");
    const viewerSpace = await session.requestReferenceSpace("viewer");
    hitTestSource = await session.requestHitTestSource({ space: viewerSpace });
    localSpace = refSpace;

    // 🎯 Dummy tujuan: bola-bola biru di depan pengguna
    addNavigationSpheres();

    renderer.setAnimationLoop(render);
  }

  function addNavigationSpheres() {
    navigationSpheres.forEach(b => scene.remove(b));
    navigationSpheres = [];

    const R = 6371000; // jari-jari bumi (meter)
    const dLat = (targetLat - userLat) * Math.PI / 180;
    const dLon = (targetLon - userLon) * Math.PI / 180;

    // jarak total ke target
    const distTotal = Math.sqrt(
      (R * dLat) ** 2 + (R * dLon * Math.cos((userLat + targetLat) * Math.PI / 360)) ** 2
    );

    // bearing (arah dari utara)
    const y = Math.sin(dLon) * Math.cos(targetLat * Math.PI / 180);
    const x = Math.cos(userLat * Math.PI / 180) * Math.sin(targetLat * Math.PI / 180) -
              Math.sin(userLat * Math.PI / 180) * Math.cos(targetLat * Math.PI / 180) * Math.cos(dLon);
    const bearing = (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;

    // arah relatif terhadap pandangan pengguna
    const relativeAngle = (bearing - userHeading) * Math.PI / 180;

    // ⚙️ Atur interval antar bola (misal tiap 5 meter)
    const step = 5;
    const numSpheres = Math.min(Math.ceil(distTotal / step), 20); // batas agar tidak kebanyakan

    for (let i = 1; i <= numSpheres; i++) {
      const distance = i * step; // posisi bola ke-i (meter)
      const xPos = Math.sin(relativeAngle) * distance;
      const zPos = -Math.cos(relativeAngle) * distance;

      const sphereGeo = new THREE.SphereGeometry(0.15, 16, 16);
      const sphereMat = new THREE.MeshBasicMaterial({
        color: 0x00aaff,
        transparent: true,
        opacity: 0.8
      });
      const sphere = new THREE.Mesh(sphereGeo, sphereMat);
      sphere.position.set(xPos, 0, zPos);
      scene.add(sphere);
      navigationSpheres.push(sphere);
    }
  }



  function render(timestamp, frame) {
    if (frame && hitTestSource) {
      const hitTestResults = frame.getHitTestResults(hitTestSource);
      if (hitTestResults.length > 0) {
        const hit = hitTestResults[0];
        const pose = hit.getPose(localSpace);
        reticle.visible = true;
        reticle.matrix.fromArray(pose.transform.matrix);
        if (!surfaceDetected) {
          surfaceDetected = true;
          scanningText.style.display = 'none';
        }
      } else {
        reticle.visible = false;
        if (surfaceDetected) {
          surfaceDetected = false;
          scanningText.style.display = 'block';
        }
      }
    }

    if (userLat && userLon) {
      addNavigationSpheres();
    }

    renderer.render(scene, camera);
  }
  </script>
</body>
</html>
