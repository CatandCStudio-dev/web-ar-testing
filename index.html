<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <title>WebXR Hit Test (Ground Marker)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    #enter-ar {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 20px;
      background: #0078ff;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      z-index: 10;
    }
    #msg {
      position: fixed; top: 14px; left: 14px;
      background: rgba(0,0,0,0.6); color: #fff;
      padding: 8px 12px; border-radius: 8px; font-family: sans-serif;
      z-index: 10; font-size: 13px;
    }
    canvas { display:block; width:100%; height:100%; }
  </style>
</head>
<body>
  <div id="msg">Tekan "Masuk AR" lalu arahkan kamera ke lantai (floor).</div>
  <button id="enter-ar">🔍 Masuk AR</button>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r152/three.min.js"></script>

  <script>
    let renderer, scene, camera;
    let xrSession = null;
    let hitTestSource = null;
    let localRefSpace = null;
    let reticle = null;

    const btn = document.getElementById('enter-ar');
    const msg = document.getElementById('msg');

    // create renderer & basic three.js scene
    function initThree() {
      // create canvas & renderer (xrCompatible)
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.autoClear = false;
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.domElement.style.position = 'absolute';
      document.body.appendChild(renderer.domElement);
      renderer.xr.enabled = true;

      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera();

      // light (optional, for non-emissive objects)
      const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
      scene.add(light);

      // Reticle: ring that will be placed on ground
      const geometry = new THREE.RingGeometry(0.12, 0.18, 32);
      const material = new THREE.MeshBasicMaterial({ color: 0x00ffff, side: THREE.DoubleSide });
      reticle = new THREE.Mesh(geometry, material);
      reticle.rotation.x = -Math.PI / 2; // make ring flat on ground
      reticle.visible = false;
      reticle.matrixAutoUpdate = false; // we'll set matrix from hit test pose
      scene.add(reticle);

      window.addEventListener('resize', onWindowResize);
    }

    function onWindowResize() {
      if (!renderer) return;
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    async function startXR() {
      if (!navigator.xr) {
        alert("WebXR tidak didukung di browser ini.");
        return;
      }

      const supported = await navigator.xr.isSessionSupported('immersive-ar');
      if (!supported) {
        alert("Perangkat/browser ini belum mendukung immersive-ar.");
        return;
      }

      try {
        xrSession = await navigator.xr.requestSession('immersive-ar', {
          requiredFeatures: ['hit-test', 'local-floor']
        });
      } catch (err) {
        console.error('Gagal requestSession:', err);
        alert('Gagal memulai AR session: ' + err.message);
        return;
      }

      // attach session to renderer
      renderer.xr.setSession(xrSession);

      // reference spaces
      localRefSpace = await xrSession.requestReferenceSpace('local-floor');
      const viewerRefSpace = await xrSession.requestReferenceSpace('viewer');

      // request hit test source (ray is cast from viewer)
      hitTestSource = await xrSession.requestHitTestSource({ space: viewerRefSpace });

      // handle session end
      xrSession.addEventListener('end', onSessionEnded);

      // start render loop
      renderer.setAnimationLoop((timestamp, frame) => {
        if (!frame) return;

        const session = frame.session;
        // get pose relative to local-floor (world)
        const pose = frame.getViewerPose(localRefSpace);
        // do hit-test
        const hitTestResults = frame.getHitTestResults(hitTestSource);
        if (hitTestResults.length > 0) {
          const hit = hitTestResults[0];
          const hitPose = hit.getPose(localRefSpace);
          // hitPose.transform.matrix --> 4x4 float32 matrix
          const mat = new THREE.Matrix4().fromArray(hitPose.transform.matrix);
          reticle.matrix.copy(mat);
          reticle.visible = true;
          msg.textContent = "Ground detected — reticle muncul. Tap layar jika ingin menempatkan objek.";
        } else {
          reticle.visible = false;
          msg.textContent = "Arahkan kamera ke permukaan datar (lantai/meja)...";
        }

        // render scene
        renderer.render(scene, camera);
      });

      // hide button
      btn.style.display = 'none';
    }

    function onSessionEnded() {
      hitTestSource = null;
      localRefSpace = null;
      xrSession = null;
      btn.style.display = '';
      msg.textContent = 'Sesi AR berakhir.';
      renderer.setAnimationLoop(null);
    }

    // init three scene immediately so canvas exists before session
    initThree();

    // start on button
    btn.addEventListener('click', () => {
      startXR();
    });
  </script>
</body>
</html>
