<!DOCTYPE html>
<html>
  <head>
    <title>AR Navigasi Kampus</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- A-Frame & AR.js -->
    <script src="https://unpkg.com/aframe@1.5.0/dist/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>

    <!-- GPS component -->
    <script src="https://unpkg.com/aframe-gps-entity-place/dist/aframe-gps-entity-place.min.js"></script>

    <style>
      #info {
        position: fixed;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.6);
        color: white;
        padding: 8px 16px;
        border-radius: 10px;
        font-family: sans-serif;
        font-size: 14px;
      }
    </style>
  </head>

  <body style="margin: 0; overflow: hidden;">
    <div id="info">Menunggu lokasi GPS...</div>

    <a-scene
      vr-mode-ui="enabled: false"
      embedded
      arjs="sourceType: webcam; debugUIEnabled: false;"
    >
      <!-- Panah 3D menghadap tujuan -->
      <a-entity id="arrow" 
                geometry="primitive: cone; radiusBottom: 0.0; radiusTop: 0.2; height: 1"
                material="color: yellow"
                position="0 1 -3">
      </a-entity>

      <!-- Lokasi tujuan -->
      <a-text 
        id="tujuanText"
        value="Gedung FTI" 
        gps-entity-place="latitude: -7.5595; longitude: 110.8567;" 
        look-at="[gps-camera]"
        scale="5 5 5"
        color="red">
      </a-text>

      <a-camera gps-camera rotation-reader></a-camera>
    </a-scene>

    <script>
      const tujuan = { lat: -7.5595, lon: 110.8567 };
      const infoBox = document.getElementById('info');
      const arrow = document.getElementById('arrow');

      // Fungsi menghitung jarak (meter)
      function getDistance(lat1, lon1, lat2, lon2) {
        const R = 6371000;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a =
          Math.sin(dLat / 2) * Math.sin(dLat / 2) +
          Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
          Math.sin(dLon / 2) * Math.sin(dLon / 2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        return R * c;
      }

      // Fungsi menghitung arah (bearing)
      function getBearing(lat1, lon1, lat2, lon2) {
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const y = Math.sin(dLon) * Math.cos(lat2 * Math.PI / 180);
        const x =
          Math.cos(lat1 * Math.PI / 180) * Math.sin(lat2 * Math.PI / 180) -
          Math.sin(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
          Math.cos(dLon);
        return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
      }

      // Update posisi pengguna
      window.addEventListener('gps-camera-update-position', (e) => {
        const user = e.detail.position;
        const jarak = getDistance(user.latitude, user.longitude, tujuan.lat, tujuan.lon);
        const arah = getBearing(user.latitude, user.longitude, tujuan.lat, tujuan.lon);

        infoBox.innerText = `Tujuan: Gedung FTI\nJarak: ${jarak.toFixed(1)} m`;

        // Ubah arah panah mengikuti bearing
        arrow.setAttribute('rotation', `0 ${arah} 0`);

        // Ubah warna panah kalau sudah dekat
        if (jarak < 10) {
          arrow.setAttribute('material', 'color', 'lime');
          infoBox.innerText = "Kamu sudah tiba di Gedung FTI ✅";
        }
      });

      window.addEventListener('camera-init', () => {
        infoBox.innerText = "Kamera aktif, menunggu GPS...";
      });
    </script>
  </body>
</html>
