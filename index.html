<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AR Navigation Prototype</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <style>
    body { margin: 0; overflow: hidden; }
    #map {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 30vh; /* 1/3 layar */
      z-index: 10;
    }
    #scanning-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 24px;
      font-family: Arial, sans-serif;
      text-shadow: 0 0 10px black;
      background: rgba(0,0,0,0.4);
      padding: 12px 20px;
      border-radius: 8px;
      display: none;
      animation: pulse 1.5s infinite;
      z-index: 5;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }
  </style>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
</head>
<body>
  <div id="scanning-text">🔍 Scanning environment...</div>
  <div id="map"></div>
  <div id="compass-arrow" style="
    position: fixed;
    top: 15px;
    left: 50%;
    transform: translateX(-50%) rotate(0deg);
    width: 60px;
    height: 60px;
    background: url('https://upload.wikimedia.org/wikipedia/commons/3/3c/Red_triangle.svg') no-repeat center;
    background-size: contain;
    z-index: 999;
    opacity: 0.9;
    pointer-events: none;
    filter: drop-shadow(0 0 3px black);
  "></div>
  <script type="module">
  import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";

  let camera, scene, renderer, reticle;
  let hitTestSource = null;
  let localSpace = null;
  let surfaceDetected = false;
  let scanningText = document.getElementById("scanning-text");
  let navigationSpheres = [];
  let userLat = 0, userLon = 0;       // lokasi pengguna
  let targetLat = -7.542726627474412, targetLon = 110.77000583632322; // lokasi tujuan (contoh)
  let userHeading = 0;                // arah pandang pengguna (kompas)


  init();

  async function init() {
    // Setup renderer
    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.xr.enabled = true;
    document.body.appendChild(renderer.domElement);

    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);
    scene.add(new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1));

    // Reticle
    const ringGeo = new THREE.RingGeometry(0.1, 0.11, 32).rotateX(-Math.PI / 2);
    const ringMat = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
    reticle = new THREE.Mesh(ringGeo, ringMat);
    reticle.matrixAutoUpdate = false;
    reticle.visible = false;
    scene.add(reticle);

    // Overlay start
    const overlay = document.createElement("div");
    overlay.textContent = "👆 Tap to Start AR Navigation";
    Object.assign(overlay.style, {
      position: "fixed", inset: 0, background: "black", color: "white",
      display: "flex", justifyContent: "center", alignItems: "center",
      fontSize: "22px", cursor: "pointer", zIndex: 100
    });
    document.body.appendChild(overlay);
    overlay.addEventListener("click", async () => {
      overlay.remove();
      startAR();
    });

    // 🗺️ Setup map (Leaflet)
    const L = await import("https://unpkg.com/leaflet/dist/leaflet-src.esm.js");
    const map = L.map('map').setView([0, 0], 18);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19
    }).addTo(map);
    const userMarker = L.marker([0, 0]).addTo(map);

    const compassArrow = document.getElementById("compass-arrow");

    // smoothing untuk kompas (opsional)
    let smoothedHeading = null;
    const smoothingFactor = 0.12;

    async function enableCompassListeners() {
      function handleOrientationEvent(event) {
        // prefer absolute jika tersedia
        const alpha = (event.absolute && event.alpha != null) ? event.alpha : event.alpha;
        if (alpha == null) return;

        // convert ke heading (derajat dari utara searah jarum jam)
        const raw = 360 - alpha;

        // smoothing simpel (hindari loncatan 0/360)
        if (smoothedHeading === null) {
          smoothedHeading = raw;
        } else {
          let diff = raw - smoothedHeading;
          if (diff > 180) diff -= 360;
          if (diff < -180) diff += 360;
          smoothedHeading += diff * smoothingFactor;
        }

        // normalisasi
        smoothedHeading = (smoothedHeading + 360) % 360;
        userHeading = smoothedHeading;

        // apply ke arrow UI
        compassArrow.style.transform = `translateX(-50%) rotate(${userHeading}deg)`;
      }

      // prefer event 'deviceorientationabsolute' jika ada
      window.addEventListener('deviceorientationabsolute', handleOrientationEvent, true);
      // fallback
      window.addEventListener('deviceorientation', handleOrientationEvent, true);
    }

    // iOS Safari membutuhkan permission
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
      // buat tombol izin kecil supaya user memberi izin kompas
      const permBtn = document.createElement('button');
      permBtn.textContent = 'Izinkan Kompas';
      Object.assign(permBtn.style, {
        position: 'fixed', bottom: '10px', left: '50%',
        transform: 'translateX(-50%)', zIndex: 2000, padding: '8px 12px'
      });
      document.body.appendChild(permBtn);
      permBtn.addEventListener('click', async () => {
        try {
          const resp = await DeviceOrientationEvent.requestPermission();
          permBtn.remove();
          if (resp === 'granted') {
            enableCompassListeners();
          } else {
            console.warn('Izin kompas ditolak');
          }
        } catch (e) {
          // fallback: tetap coba pasang listener
          console.warn('requestPermission error, pakai fallback', e);
          permBtn.remove();
          enableCompassListeners();
        }
      });
    } else {
      // Android / browser lain: langsung aktifkan listener
      enableCompassListeners();
    }

    window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  }

  async function startAR() {
    const session = await navigator.xr.requestSession("immersive-ar", {
      requiredFeatures: ["hit-test", "dom-overlay"],
      domOverlay: { root: document.body }
    });
    renderer.xr.setReferenceSpaceType("local");
    await renderer.xr.setSession(session);

    scanningText.style.display = 'block';

    const refSpace = await session.requestReferenceSpace("local");
    const viewerSpace = await session.requestReferenceSpace("viewer");
    hitTestSource = await session.requestHitTestSource({ space: viewerSpace });
    localSpace = refSpace;

    renderer.setAnimationLoop(render);
  }

  function addNavigationSpheres(originPose) {
    // hanya buat 4–5 bola ke depan pengguna
    const numSpheres = 5;
    const stepDistance = 1.0; // jarak antar bola (meter)

    for (let i = 1; i <= numSpheres; i++) {
      const distance = i * stepDistance;
      const angle = THREE.MathUtils.degToRad(userHeading); // arah kompas dari perangkat

      // Posisi relatif terhadap kamera
      const xPos = Math.sin(angle) * distance;
      const zPos = -Math.cos(angle) * distance;

      const sphereGeo = new THREE.SphereGeometry(0.1, 16, 16);
      const sphereMat = new THREE.MeshBasicMaterial({
        color: 0x00aaff,
        transparent: true,
        opacity: 0.9
      });
      const sphere = new THREE.Mesh(sphereGeo, sphereMat);

      // letakkan di atas plane terdeteksi
      if (originPose) {
        const planeY = originPose.transform.position.y;
        sphere.position.set(xPos, planeY + 0.05, zPos);
      } else {
        sphere.position.set(xPos, 0, zPos);
      }

      scene.add(sphere);
      navigationSpheres.push(sphere);
    }
  }


  function render(timestamp, frame) {
    if (frame && hitTestSource) {
      const hitTestResults = frame.getHitTestResults(hitTestSource);
      if (hitTestResults.length > 0) {
        const hit = hitTestResults[0];
        const pose = hit.getPose(localSpace);
        reticle.visible = true;
        reticle.matrix.fromArray(pose.transform.matrix);
        if (!surfaceDetected) {
          surfaceDetected = true;
          scanningText.style.display = 'none';
        }
      } else {
        reticle.visible = false;
        if (surfaceDetected) {
          surfaceDetected = false;
          scanningText.style.display = 'block';
        }
      }
    }

    if (surfaceDetected && navigationSpheres.length === 0 && reticle.visible) {
      const pose = frame.getHitTestResults(hitTestSource)[0]?.getPose(localSpace);
      if (pose) addNavigationSpheres(pose);
    }

    // Jika pengguna bergerak maju, tambahkan bola baru di depan
    const cameraPosition = renderer.xr.getCamera().position;
    if (navigationSpheres.length > 0) {
      const lastSphere = navigationSpheres[navigationSpheres.length - 1];
      const dist = cameraPosition.distanceTo(lastSphere.position);
      if (dist < 2 && navigationSpheres.length < 30) {
        const pose = frame?.getHitTestResults(hitTestSource)[0]?.getPose(localSpace);
        if (pose) addNavigationSpheres(pose);
      }
    }


    renderer.render(scene, camera);
  }
  </script>
</body>
</html>
