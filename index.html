<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>AR Navigation Dummy</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <style>
    body { margin: 0; overflow: hidden; }
    #scanning-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 24px;
      font-family: Arial, sans-serif;
      text-shadow: 0 0 10px black;
      background: rgba(0, 0, 0, 0.4);
      padding: 12px 20px;
      border-radius: 8px;
      display: none;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.5; }
      100% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="scanning-text">🔍 Scanning environment...</div>

  <script type="module">
    import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";
    import { ARButton } from "https://unpkg.com/three@0.160.0/examples/jsm/webxr/ARButton.js";

    let camera, scene, renderer, reticle;
    let controller;
    let scanningText = document.getElementById("scanning-text");
    let surfaceDetected = false;
    let hitTestSource = null;
    let localSpace = null;
    let userPosition = null;

    // 🌐 Ubah tujuan dummy di sini
    const targetLocation = {
      lat: -7.542744073687371,  // contoh: UMS
      lon: 110.77000009438967
    };

    init();
    animate();

    function init() {
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true;
      document.body.appendChild(renderer.domElement);

      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);
      scene.add(camera);

      const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
      scene.add(light);

      const geometry = new THREE.RingGeometry(0.1, 0.11, 32).rotateX(-Math.PI / 2);
      const material = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
      reticle = new THREE.Mesh(geometry, material);
      reticle.matrixAutoUpdate = false;
      reticle.visible = false;
      scene.add(reticle);

      controller = renderer.xr.getController(0);
      controller.addEventListener("select", onSelect);
      scene.add(controller);

      const arButton = ARButton.createButton(renderer, { requiredFeatures: ["hit-test"] });
      document.body.appendChild(arButton);

      renderer.xr.addEventListener('sessionstart', () => {
        scanningText.style.display = 'block';
        surfaceDetected = false;
        getUserLocation();
      });

      renderer.xr.addEventListener('sessionend', () => {
        scanningText.style.display = 'none';
        reticle.visible = false;
        surfaceDetected = false;
      });

      window.addEventListener("resize", onWindowResize);
    }

    function onSelect() {
      if (reticle.visible) {
        const geometry = new THREE.BoxGeometry(0.1, 0.1, 0.1);
        const material = new THREE.MeshPhongMaterial({ color: 0x44aa88 });
        const mesh = new THREE.Mesh(geometry, material);
        mesh.position.setFromMatrixPosition(reticle.matrix);
        scene.add(mesh);
      }
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    async function render(timestamp, frame) {
      if (frame) {
        const referenceSpace = renderer.xr.getReferenceSpace();
        const session = renderer.xr.getSession();

        if (!hitTestSource) {
          const viewerSpace = await session.requestReferenceSpace("viewer");
          hitTestSource = await session.requestHitTestSource({ space: viewerSpace });
          localSpace = referenceSpace;
        }

        const hitTestResults = frame.getHitTestResults(hitTestSource);

        if (hitTestResults.length > 0) {
          const hit = hitTestResults[0];
          const pose = hit.getPose(localSpace);
          reticle.visible = true;
          reticle.matrix.fromArray(pose.transform.matrix);

          if (!surfaceDetected) {
            surfaceDetected = true;
            scanningText.style.display = 'none';
            if (userPosition) spawnNavigationBalls(userPosition, targetLocation);
          }
        } else {
          reticle.visible = false;
          if (surfaceDetected) {
            surfaceDetected = false;
            scanningText.style.display = 'block';
          }
        }
      }

      renderer.render(scene, camera);
    }

    function animate() {
      renderer.setAnimationLoop(render);
    }

    // 🛰️ Ambil posisi GPS pengguna
    function getUserLocation() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          pos => {
            userPosition = {
              lat: pos.coords.latitude,
              lon: pos.coords.longitude
            };
            console.log("User location:", userPosition);
          },
          err => console.warn("Failed to get location:", err),
          { enableHighAccuracy: true }
        );
      }
    }

    // 📍 Spawn bola biru ke arah tujuan (dummy)
    function spawnNavigationBalls(start, end) {
      const distance = getDistanceFromLatLonInMeters(start.lat, start.lon, end.lat, end.lon);
      const bearing = getBearing(start.lat, start.lon, end.lat, end.lon);

      const numBalls = Math.floor(distance / 2);
      for (let i = 1; i <= numBalls; i++) {
        const ball = new THREE.Mesh(
          new THREE.SphereGeometry(0.1, 16, 16),
          new THREE.MeshBasicMaterial({ color: 0x0088ff, transparent: true, opacity: 0.5 })
        );
        ball.position.set(0, 0, -i * 2); // sementara dalam arah pandang kamera
        scene.add(ball);
      }

      console.log(`Spawned ${numBalls} balls toward bearing ${bearing.toFixed(2)}°`);
    }

    // 📏 Rumus jarak antar koordinat
    function getDistanceFromLatLonInMeters(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLon/2)**2;
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }

    // 🧭 Rumus arah (bearing)
    function getBearing(lat1, lon1, lat2, lon2) {
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const y = Math.sin(dLon) * Math.cos(lat2 * Math.PI / 180);
      const x = Math.cos(lat1 * Math.PI / 180) * Math.sin(lat2 * Math.PI / 180)
              - Math.sin(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.cos(dLon);
      return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
    }

  </script>
</body>
</html>
