<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Hello WebXR Auto Start</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <style>
    body { margin: 0; overflow: hidden; }
    #scanning-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 24px;
      font-family: Arial, sans-serif;
      text-shadow: 0 0 10px black;
      background: rgba(0, 0, 0, 0.4);
      padding: 12px 20px;
      border-radius: 8px;
      display: none;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.5; }
      100% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="overlay" style="
      position: fixed;
      inset: 0;
      background: black;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-family: Arial;
      cursor: pointer;
  ">
    👆 Tap to Start AR
  </div>

  <div id="scanning-text" style="display:none;">🔍 Scanning environment...</div>

  <script type="module">
  import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";

  let camera, scene, renderer, reticle;
  let controller;
  let scanningText = document.getElementById("scanning-text");
  let overlay = document.getElementById("overlay");
  let surfaceDetected = false;
  let hitTestSource = null;
  let localSpace = null;

  overlay.addEventListener("click", async () => {
    overlay.style.display = "none"; // sembunyikan overlay
    await startAR(); // mulai AR setelah user gesture
  });

  init();

  function init() {
    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.xr.enabled = true;
    document.body.appendChild(renderer.domElement);

    scene = new THREE.Scene();

    camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);
    scene.add(new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1));

    const geometry = new THREE.RingGeometry(0.1, 0.11, 32).rotateX(-Math.PI / 2);
    const material = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
    reticle = new THREE.Mesh(geometry, material);
    reticle.matrixAutoUpdate = false;
    reticle.visible = false;
    scene.add(reticle);

    controller = renderer.xr.getController(0);
    controller.addEventListener("select", onSelect);
    scene.add(controller);

    window.addEventListener("resize", onWindowResize);
  }

  async function startAR() {
    const session = await navigator.xr.requestSession("immersive-ar", {
      requiredFeatures: ["hit-test", "dom-overlay"],
      domOverlay: { root: document.body },
    });

    renderer.xr.setReferenceSpaceType("local");
    await renderer.xr.setSession(session);

    scanningText.style.display = "block"; // tampilkan teks scanning
    surfaceDetected = false;

    const referenceSpace = await session.requestReferenceSpace("local");
    const viewerSpace = await session.requestReferenceSpace("viewer");
    hitTestSource = await session.requestHitTestSource({ space: viewerSpace });
    localSpace = referenceSpace;

    renderer.setAnimationLoop(render);
  }

  function onSelect() {
    if (reticle.visible) {
      const geometry = new THREE.BoxGeometry(0.1, 0.1, 0.1);
      const material = new THREE.MeshPhongMaterial({ color: 0x44aa88 });
      const mesh = new THREE.Mesh(geometry, material);
      mesh.position.setFromMatrixPosition(reticle.matrix);
      scene.add(mesh);
    }
  }

  function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  }

  function render(timestamp, frame) {
    if (frame && hitTestSource) {
      const hitTestResults = frame.getHitTestResults(hitTestSource);
      if (hitTestResults.length > 0) {
        const hit = hitTestResults[0];
        const pose = hit.getPose(localSpace);
        reticle.visible = true;
        reticle.matrix.fromArray(pose.transform.matrix);

        if (!surfaceDetected) {
          surfaceDetected = true;
          scanningText.style.display = "none";
        }
      } else {
        reticle.visible = false;
        if (surfaceDetected) {
          surfaceDetected = false;
          scanningText.style.display = "block";
        }
      }
    }

    renderer.render(scene, camera);
  }
  </script>
</body>
</html>
