<!DOCTYPE html>
<html>
<head>
    <title>AR.js Location-Based Sempurna</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script> 
    
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
        }
    </style>
</head>
<body style='margin : 0px; overflow: hidden;'>

    <a-scene
        vr-mode-ui="enabled: false"
        embedded
        arjs='sourceType: webcam; debugUIEnabled: false;'  >
        
        <a-cylinder 
            material="color: gold; opacity: 0.8" 
            radius="10" 
            height="30"
            position="0 0 0"
            scale="1 1 1"
            rotation="0 0 0"
            shadow
            gps-entity-place="latitude: -7.541183619279909; longitude: 110.62344375998039;"
        >
            <a-text
                value="OBJECK AR LOKASI"
                position="0 15.5 0"
                scale="15 15 15"
                align="center"
                look-at="[gps-camera]" 
                color="#FFFFFF"
            ></a-text>
        </a-cylinder>

        <a-camera 
            gps-camera 
            rotation-reader 
        ></a-camera>
        
    </a-scene>

</body>
</html>
