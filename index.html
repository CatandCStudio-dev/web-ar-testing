<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <title>AR GPS Arrow</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

  <!-- A-Frame + AR.js (GPS Mode) -->
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.3.2/aframe/build/aframe-ar-nft.js"></script>


  <style>
    body, html { margin: 0; padding: 0; overflow: hidden; }
    #info {
      position: fixed;
      top: 10px; left: 10px;
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 8px 12px;
      border-radius: 8px;
      font-family: sans-serif;
      font-size: 14px;
      z-index: 9999;
    }
  </style>
</head>
<body>
  <div id="info">📡 Mengambil lokasi...</div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    arjs="sourceType: webcam; trackingMethod: best; debugUIEnabled: false;">
    
    <!-- Kamera AR berbasis GPS -->
    <a-camera gps-camera rotation-reader></a-camera>

    <!-- Model panah -->
    <a-entity id="arrow"
      gps-entity-place="latitude: -7.5425223; longitude: 110.7700842"
      gltf-model="https://raw.githubusercontent.com/CatandCStudio-dev/web-ar-testing/test-ar-js/Assets/arrow.glb"
      scale="1 1 1"
      rotation="0 0 0">
    </a-entity>
  </a-scene>

  <script>
    const info = document.getElementById('info');
    const arrow = document.getElementById('arrow');

    // Update posisi pengguna
    window.addEventListener('gps-camera-update-position', (e) => {
      const userLat = e.detail.position.latitude;
      const userLon = e.detail.position.longitude;
      info.innerHTML = `📍 Lokasi Anda:<br>${userLat.toFixed(5)}, ${userLon.toFixed(5)}`;
    });

    // Debug jika model sudah dimuat
    arrow.addEventListener('model-loaded', () => {
      console.log("✅ Model panah berhasil dimuat!");
      info.innerHTML = "✅ Model panah dimuat dan siap.";
    });
  </script>
</body>
</html>
