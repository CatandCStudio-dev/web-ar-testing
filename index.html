<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <title>AR Navigation Demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- A-Frame dan AR.js -->
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.3.2/aframe/build/aframe-ar.js"></script>

  <!-- Leaflet Mini Map -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    body, html { margin: 0; padding: 0; overflow: hidden; }
    #map { position: fixed; bottom: 10px; left: 10px; width: 150px; height: 150px; border: 2px solid #333; border-radius: 8px; z-index: 2; }
    #info { position: fixed; top: 10px; left: 10px; z-index: 2; background: rgba(255,255,255,0.85); padding: 8px 12px; border-radius: 8px; font-family: sans-serif; }
  </style>
</head>
<body>
  <div id="info">Mendeteksi lokasi... pastikan GPS aktif 🔄</div>
  <div id="map"></div>

  <!-- Scene AR -->
  <a-scene
    vr-mode-ui="enabled: false"
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false;">
    
    <a-camera gps-camera rotation-reader></a-camera>

    <!-- Panah 3D menuju lokasi tujuan -->
    <a-entity id="arrow"
      gltf-model="https://cdn.jsdelivr.net/gh/KhronosGroup/glTF-Sample-Models@master/2.0/Arrow/glTF/Arrow.gltf"
      scale="5 5 5"
      gps-entity-place="latitude: 0; longitude: 0;"
      visible="false">
    </a-entity>
  </a-scene>

  <script>
    // === Koordinat tujuan (contoh: gedung kampus) ===
    const target = { lat: -7.542522355861818, lon: 110.77008427955737, name: "Gedung Tujuan" };

    const arrow = document.getElementById('arrow');
    const info = document.getElementById('info');

    // --- Inisialisasi mini map ---
    const map = L.map('map').setView([target.lat, target.lon], 18);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);
    const targetMarker = L.marker([target.lat, target.lon]).addTo(map).bindPopup(target.name);
    const userMarker = L.marker([0, 0]).addTo(map);

    // --- Update posisi pengguna ---
    navigator.geolocation.watchPosition(
      (pos) => {
        const lat = pos.coords.latitude;
        const lon = pos.coords.longitude;
        userMarker.setLatLng([lat, lon]);
        map.setView([lat, lon]);
        info.innerHTML = `📍 Lokasi Anda:<br>${lat.toFixed(5)}, ${lon.toFixed(5)}`;

        // Jika panah belum muncul, tampilkan dan set koordinat target
        if (!arrow.getAttribute('visible')) {
          arrow.setAttribute('visible', 'true');
          arrow.setAttribute('gps-entity-place', `latitude: ${target.lat}; longitude: ${target.lon};`);
          console.log("Panah diarahkan ke:", target.lat, target.lon);
        }
      },
      (err) => {
        info.innerHTML = "❌ Tidak bisa mendapatkan lokasi: " + err.message;
      },
      { enableHighAccuracy: true, maximumAge: 0 }
    );
  </script>
</body>
</html>
