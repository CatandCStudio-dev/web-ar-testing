<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <title>AR GPS Arrow Path</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

  <!-- A-Frame + AR.js -->
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.3.2/aframe/build/aframe-ar-nft.js"></script>

  <style>
    body, html { margin: 0; padding: 0; overflow: hidden; }
    #info {
      position: fixed;
      top: 10px; left: 10px;
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 8px 12px;
      border-radius: 8px;
      font-family: sans-serif;
      font-size: 14px;
      z-index: 9999;
    }
  </style>
</head>
<body>
  <div id="info">📡 Mengambil lokasi...</div>

  <!-- Scene AR -->
  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    arjs="sourceType: webcam; trackingMethod: best; debugUIEnabled: false;">
    
    <a-camera gps-camera rotation-reader></a-camera>

    <!-- Container untuk panah -->
    <a-entity id="arrow-container"></a-entity>
  </a-scene>

  <script>
    const info = document.getElementById('info');
    const container = document.getElementById('arrow-container');
    const ARROW_MODEL = "https://raw.githubusercontent.com/CatandCStudio-dev/web-ar-testing/test-ar-js/Assets/SphereArrow.glb";

    // 🎯 Koordinat target
    const TARGET = { lat: -7.5425223, lon: 110.7700842 };

    // Jarak antar panah (meter)
    const STEP = 10;

    // offset rotasi model (ubah jika model menghadap axis lain)
    const MODEL_YAW_OFFSET = 180; // contoh: model default menghadap -Z, tambahkan 180°

    // flag supaya titik hanya di-generate sekali dari posisi awal
    let arrowsCreated = false;
    let startPosition = null;

    // Fungsi membuat deretan panah dari posisi START ke target (titik tetap)
    function createArrowPathFromStart(startLat, startLon, targetLat, targetLon) {
      // Hapus panah lama (jika ada)
      while (container.firstChild) container.removeChild(container.firstChild);

      const totalDistance = getDistance(startLat, startLon, targetLat, targetLon);
      const bearing = getBearing(startLat, startLon, targetLat, targetLon);

      const numArrows = Math.max(1, Math.floor(totalDistance / STEP));
      info.innerHTML += `<br>🪶 Membuat ${numArrows} panah (fixed) ...`;

      // buat panah pada titik-titik sepanjang garis start->target
      for (let i = 1; i <= numArrows; i++) {
        const d = STEP * i;
        // jangan melebihi target (last point <= totalDistance)
        if (d > totalDistance) break;
        const point = getDestinationPoint(startLat, startLon, bearing, d);

        // buat entity panah yang awalnya menggunakan gps-entity-place
        const arrow = document.createElement('a-entity');
        arrow.setAttribute('gltf-model', ARROW_MODEL);
        arrow.setAttribute('scale', '1.5 1.5 1.5');
        arrow.setAttribute('gps-entity-place', `latitude: ${point.lat}; longitude: ${point.lon}`);
        container.appendChild(arrow);

        // ketika model sudah termuat, tunggu sebentar supaya AR.js sudah meng-position-kan entity
        arrow.addEventListener('model-loaded', () => {
          // beri waktu singkat agar gps-entity-place sudah menghitung posisi world
          setTimeout(() => {
            try {
              // baca posisi world saat ini
              const worldPos = new THREE.Vector3();
              arrow.object3D.getWorldPosition(worldPos);

              // set rotasi agar menghadap bearing
              const yaw = (bearing + MODEL_YAW_OFFSET) % 360;
              arrow.object3D.rotation.set(0, THREE.Math.degToRad(yaw), 0);

              // 'lock' posisi: pindahkan posisi lokal ke worldPos lalu hapus gps-entity-place
              // supaya AR.js tidak lagi meng-update transform entity ini
              // (set worldPos sebagai posisi lokal terhadap scene)
              arrow.object3D.position.copy(worldPos);
              // pastikan tidak ada parent transform yang mengubahnya:
              // ubah posisi ke atribut A-Frame juga (optional)
              arrow.setAttribute('position', `${worldPos.x} ${worldPos.y} ${worldPos.z}`);

              // hapus atribut gps-entity-place sehingga tidak di-update lagi
              arrow.removeAttribute('gps-entity-place');

              // disable matrix auto update jika ingin mengunci lebih agresif
              arrow.object3D.matrixAutoUpdate = false;
            } catch (err) {
              console.warn('Gagal mengunci panah:', err);
            }
          }, 600); // sesuaikan delay jika perlu (500-1200ms)
        });
      }
    }

    // Saat posisi pengguna diperbarui
    window.addEventListener('gps-camera-update-position', (e) => {
      const userLat = e.detail.position.latitude;
      const userLon = e.detail.position.longitude;

      const distance = getDistance(userLat, userLon, TARGET.lat, TARGET.lon);
      const bearing = getBearing(userLat, userLon, TARGET.lat, TARGET.lon);

      info.innerHTML = `
        📍 Posisi Anda: ${userLat.toFixed(5)}, ${userLon.toFixed(5)}<br>
        🎯 Tujuan: ${TARGET.lat.toFixed(5)}, ${TARGET.lon.toFixed(5)}<br>
        📏 Jarak saat ini: ${distance.toFixed(1)} m<br>
        🧭 Bearing saat ini: ${bearing.toFixed(1)}°
      `;

      // jika belum dibuat, gunakan posisi pertama sebagai start dan buat titik tetap
      if (!arrowsCreated) {
        arrowsCreated = true;
        startPosition = { lat: userLat, lon: userLon };
        createArrowPathFromStart(startPosition.lat, startPosition.lon, TARGET.lat, TARGET.lon);
      }
    });

    // ====== Fungsi utilitas ======
    function getDistance(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const toRad = x => x * Math.PI / 180;
      const φ1 = toRad(lat1), φ2 = toRad(lat2);
      const Δφ = toRad(lat2 - lat1), Δλ = toRad(lon2 - lon1);
      const a = Math.sin(Δφ/2)**2 + Math.cos(φ1)*Math.cos(φ2)*Math.sin(Δλ/2)**2;
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }

    function getBearing(lat1, lon1, lat2, lon2) {
      const toRad = x => x * Math.PI / 180;
      const toDeg = x => x * 180 / Math.PI;
      const φ1 = toRad(lat1), φ2 = toRad(lat2);
      const Δλ = toRad(lon2 - lon1);
      const y = Math.sin(Δλ) * Math.cos(φ2);
      const x = Math.cos(φ1)*Math.sin(φ2) - Math.sin(φ1)*Math.cos(φ2)*Math.cos(Δλ);
      const brng = Math.atan2(y, x);
      return (toDeg(brng) + 360) % 360;
    }

    // Hitung titik tujuan dengan jarak dan arah tertentu
    function getDestinationPoint(lat, lon, bearing, distance) {
      const R = 6371e3;
      const toRad = x => x * Math.PI / 180;
      const toDeg = x => x * 180 / Math.PI;
      const δ = distance / R;
      const θ = toRad(bearing);
      const φ1 = toRad(lat);
      const λ1 = toRad(lon);

      const φ2 = Math.asin(Math.sin(φ1) * Math.cos(δ) +
                           Math.cos(φ1) * Math.sin(δ) * Math.cos(θ));
      const λ2 = λ1 + Math.atan2(Math.sin(θ) * Math.sin(δ) * Math.cos(φ1),
                                 Math.cos(δ) - Math.sin(φ1) * Math.sin(φ2));

      return { lat: toDeg(φ2), lon: toDeg(λ2) };
    }
  </script>
</body>
</html>
