<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Hello WebXR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <style>
    body { margin: 0; overflow: hidden; }
    #enter-ar {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 24px;
      background: #007aff;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      z-index: 10001;
      pointer-events: auto;
    }
    /* scanning overlay + progress bar */
    #scanning-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 18px;
      font-family: Arial, sans-serif;
      text-shadow: 0 0 10px black;
      background: rgba(0, 0, 0, 0.5);
      padding: 12px 16px;
      border-radius: 8px;
      display: none;
      z-index: 10002;
      pointer-events: none;
      width: 280px;
      box-sizing: border-box;
      text-align: center;
    }
    #scan-label { margin-bottom: 8px; display:block; }
    #scan-bar { width: 100%; height: 10px; background: rgba(255,255,255,0.12); border-radius: 6px; overflow: hidden; }
    #scan-bar-inner { width: 0%; height: 100%; background: #4cd964; transition: width 120ms linear; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
  </style>
</head>
<body>
  <button id="enter-ar">Enter AR</button>
  <div id="scanning-text">
    <span id="scan-label">🔍 Scanning environment...</span>
    <div id="scan-bar"><div id="scan-bar-inner"></div></div>
    <div id="scan-percent" style="margin-top:8px;font-size:13px;opacity:0.9">0%</div>
  </div>

  <script type="module">
  import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";
  import { ARButton } from "https://unpkg.com/three@0.160.0/examples/jsm/webxr/ARButton.js";

  let camera, scene, renderer, reticle;
  let controller;
  let scanningText = document.getElementById("scanning-text");
  let surfaceDetected = false;

  init();
  animate();

  function init() {
    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.xr.enabled = true;
    document.body.appendChild(renderer.domElement);

    scene = new THREE.Scene();

    camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

    const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
    scene.add(light);

    const geometry = new THREE.RingGeometry(0.1, 0.11, 32).rotateX(-Math.PI / 2);
    const material = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
    reticle = new THREE.Mesh(geometry, material);
    reticle.matrixAutoUpdate = false;
    reticle.visible = false;
    scene.add(reticle);

    controller = renderer.xr.getController(0);
    controller.addEventListener("select", onSelect);
    scene.add(controller);

    // Tambahkan AR Button dengan callback untuk mengetahui kapan mode AR aktif
    const arButton = ARButton.createButton(renderer, { requiredFeatures: ["hit-test"] });
    document.body.appendChild(arButton);

    // tampilkan overlay scanning segera saat user menekan tombol AR (sementara menunggu sessionstart)
    arButton.addEventListener('click', () => {
      if (scanningText) scanningText.style.display = 'block';
      // reset progress UI when user requests AR
      scanProgress = 0;
      updateScanUI();
      scanningComplete = false;
      console.log('AR button clicked - showing scanning overlay');
    });

    // pastikan renderer canvas di belakang overlay
    renderer.domElement.style.position = 'absolute';
    renderer.domElement.style.top = '0';
    renderer.domElement.style.left = '0';
    renderer.domElement.style.zIndex = '0';

    // Ketika user masuk ke mode AR
    renderer.xr.addEventListener('sessionstart', () => {
      console.log('sessionstart fired');
      scanningText.style.display = 'block';
      surfaceDetected = false;
      // reset scanning/progress state
      scanProgress = 0;
      scanningComplete = false;
      updateScanUI();
    });
  
    // Ketika user keluar dari mode AR
    renderer.xr.addEventListener('sessionend', () => {
      console.log('sessionend fired');
      scanningText.style.display = 'none'; // sembunyikan teks
      reticle.visible = false;
      surfaceDetected = false;
      scanProgress = 0;
      scanningComplete = false;
      updateScanUI();
    });

    window.addEventListener("resize", onWindowResize);
  }

  function onSelect() {
    if (reticle.visible) {
      const geometry = new THREE.BoxGeometry(0.1, 0.1, 0.1);
      const material = new THREE.MeshPhongMaterial({ color: 0x44aa88 });
      const mesh = new THREE.Mesh(geometry, material);
      mesh.position.setFromMatrixPosition(reticle.matrix);
      scene.add(mesh);
    }
  }

  function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  }

  function animate() {
    renderer.setAnimationLoop(render);
  }

  let hitTestSource = null;
  let localSpace = null;
  // scanning progress state
  let scanProgress = 0; // 0..100
  let scanningComplete = false;
  const SCAN_INC = 6;    // kenaikan progress per frame sukses (sesuaikan)
  const SCAN_DEC = 3;    // penurunan progress per frame gagal
  const SCAN_THRESHOLD = 100;

  const scanBarInner = document.getElementById('scan-bar-inner');
  const scanPercent = document.getElementById('scan-percent');

  function updateScanUI(){
    if (!scanBarInner || !scanPercent) return;
    const pct = Math.max(0, Math.min(100, Math.round(scanProgress)));
    scanBarInner.style.width = pct + '%';
    scanPercent.textContent = pct + '%';
  }
  
  async function render(timestamp, frame) {
    if (frame) {
      const referenceSpace = renderer.xr.getReferenceSpace();
      const session = renderer.xr.getSession();

      if (!hitTestSource) {
        const viewerSpace = await session.requestReferenceSpace("viewer");
        hitTestSource = await session.requestHitTestSource({ space: viewerSpace });
        localSpace = referenceSpace;
      }

      const hitTestResults = frame.getHitTestResults(hitTestSource);
  
      if (hitTestResults.length > 0) {
        const hit = hitTestResults[0];
        const pose = hit.getPose(localSpace);
        reticle.visible = true;
        reticle.matrix.fromArray(pose.transform.matrix);
  
        // Sembunyikan teks scanning saat permukaan sudah terdeteksi
        if (!surfaceDetected) {
          surfaceDetected = true;
          // do not immediately hide: increase progress instead to ensure stability
          scanningText.style.display = 'block';
        }
        // increase progress while hit-test is consistently successful
        if (!scanningComplete) {
          scanProgress = Math.min(SCAN_THRESHOLD, scanProgress + SCAN_INC);
          updateScanUI();
          if (scanProgress >= SCAN_THRESHOLD) {
            scanningComplete = true;
            scanningText.style.display = 'none';
            console.log('Scanning complete: environment recognized.');
          }
        }
  
      } else {
        reticle.visible = false;
  
        // Tampilkan teks kembali jika kehilangan tracking
        if (surfaceDetected) {
          surfaceDetected = false;
          scanningText.style.display = 'block';
        }
        // decrease progress on misses (only if not complete)
        if (!scanningComplete) {
          scanProgress = Math.max(0, scanProgress - SCAN_DEC);
          updateScanUI();
        }
      }
    }
  
    renderer.render(scene, camera);
  }
  
  // safety: ensure UI updated even before first frame
  updateScanUI();
  </script>
</body>
</html>
